services:

  # --------------------------------------------------------
  # Основное приложение: Telegram-бот + AI агент + Админка
  # --------------------------------------------------------
  app:
    build: .
    container_name: telegram-bot-app
    restart: always
    ports:
      - "3000:3000"   # Main Bot Server + встроенная админка UI
      - "4000:4000"   # Admin Panel API Server
    env_file: .env
    volumes:
      - ./knowledge-base:/app/knowledge-base   # База знаний (JSON-файлы)
      - ./media:/app/media                     # Фото, видео, презентации
      - ./logs:/app/logs                       # Логи
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

