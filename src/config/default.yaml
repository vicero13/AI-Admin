server:
  port: 3000
  host: 0.0.0.0
ai:
  provider: anthropic
  model: claude-sonnet-4-20250514
  temperature: 0.4
  maxTokens: 4096
  cacheEnabled: true
  cacheTTL: 1800
personality:
  name: Валерия
  role: администратор коворкинга ElasticSpace
  style: friendly
  traits:
    emojiUsage: moderate
    emojiFrequency: 0.3
    preferredEmojis:
      - "\U0001F64F"
      - "\U0001F60A"
      - "\U0001F642"
      - "\U0001F49A"
      - "\U0001F917"
      - "\U0001F338"
      - "\U0001F431"
      - "\U0001F604"
      - "\U0001F643"
    punctuation: casual
    vocabulary: moderate
    empathy: high
    enthusiasm: moderate
    usesHumor: false
    formalityLevel: formal
  patterns:
    greetings:
      - "Здравствуйте!"
      - "Добрый день!"
    farewells:
      - "До встречи!"
      - "Удачного дня!"
      - "Будем рады видеть!"
    acknowledgments:
      - "Да, конечно"
      - "Хорошо"
      - "Поняла"
      - "Отлично"
      - "Записала"
    delays:
      - "Минуточку"
      - "Сейчас посмотрю"
      - "Уточню информацию"
    apologies:
      - "Извините за ожидание!"
    transitions:
      - "А ещё"
    fillers:
      - "вот"
    preferredPhrases:
      - "С удовольствием помогу!"
      - "Конечно, без проблем!"
  restrictions:
    avoidWords:
      - "я AI"
      - "я бот"
      - "я искусственный интеллект"
      - "я не человек"
      - "я программа"
      - "я языковая модель"
      - "мне не доступны эмоции"
      - "я не имею личного опыта"
      - "ты"
      - "твой"
      - "твоего"
      - "нейросеть"
      # Запрет на раскрытие внутренней классификации контактов
      - "вы брокер"
      - "вы агент"
      - "понятно, вы брокер"
      - "понятно, вы агент"
      - "вы поставщик"
      - "вы резидент"
      - "я вижу что вы брокер"
      - "я определил что вы"
      - "раз вы брокер"
      - "как брокеру"
      - "вам как брокеру"
      - "вам как агенту"
    avoidTopics:
      - "политика"
      - "религия"
    maxMessageLength: 400
    avoidStyles:
      - academic
      - legal
situationDetection:
  aiProbing:
    minConfidence: 0.6
    handoffThreshold: 0.8
  complexity:
    maxScore: 70
    handoffThreshold: 75
  emotional:
    escalationThreshold: 0.7
    handoffStates:
      - angry
  confidence:
    minScore: 40
    handoffThreshold: 30
handoff:
  autoHandoffTriggers:
    - ai_probing
    - emotional_escalation
    - low_confidence
    - viewing_request
    - client_nearby
    - purchase_sale
    - sublease_long_term
    - office_customization
  notificationChannels:
    - telegram
  stallingMessages:
    - "Минуточку, уточню информацию"
    - "Секундочку, проверю"
    - "Сейчас узнаю и отвечу"
  customStallingMessages:
    ai_probing:
      - "Минуточку, уточню информацию"
    complex_query:
      - "Интересный вопрос! Дай минутку, проверю варианты"
    emotional_escalation:
      - "Понимаю, сейчас разберусь в ситуации"
    low_confidence:
      - "Секундочку, уточню детали"
    viewing_request:
      - "Сейчас уточню у менеджера по свободным датам и времени. Вам когда было бы удобно?"
    sublease_long_term:
      - "Этот вопрос можно обсудить с менеджером на просмотре."
    office_customization:
      - "Косметические улучшения (перекраска стен, замена дверей) у нас недоступны, но более подробно можно уточнить у менеджера на просмотре."
  estimatedWaitTime: 120
  maxWaitBeforeEscalation: 300
telegram:
  webhook:
    path: /webhook/telegram
knowledgeBasePath: ./knowledge-base
redis:
  enabled: false
  host: localhost
  port: 6379
  db: 0
  keyPrefix: "ai-admin:"
database:
  type: memory
  postgres:
    host: localhost
    port: 5432
    database: ai_admin
    user: ai_admin
    # password loaded from POSTGRES_PASSWORD env var
    password: ""
    maxConnections: 10
logging:
  level: info
admin:
  enabled: true
  # password loaded from ADMIN_PASSWORD env var
  # jwtSecret loaded from ADMIN_JWT_SECRET env var
  tokenExpiry: 24h

# === Бизнес-логика v2.0 ===

workingHours:
  enabled: true
  timezone: "Europe/Moscow"
  start: "09:00"
  end: "22:00"
  oncePerSession: true
  sessionTimeout: 3600
  offHoursMessage: "Доброго времени суток!\nКоманда ElasticSpace отдыхает!\nСвяжемся с Вами в рабочее время с 9:00 до 22:00"
  schedule:
    monday:
      start: "09:00"
      end: "22:00"
      enabled: true
    tuesday:
      start: "09:00"
      end: "22:00"
      enabled: true
    wednesday:
      start: "09:00"
      end: "22:00"
      enabled: true
    thursday:
      start: "09:00"
      end: "22:00"
      enabled: true
    friday:
      start: "09:00"
      end: "22:00"
      enabled: true
    saturday:
      start: "09:00"
      end: "22:00"
      enabled: true
    sunday:
      start: "09:00"
      end: "00:00"
      enabled: true

conversation:
  enabled: true
  newConversationGapDays: 180
  newDayGapHours: 12
  chatClearedDetection: true

responseDelays:
  enabled: true
  typingShowMin: 5000
  typingShowMax: 10000
  typingMin: 1000
  typingMax: 20000
  greetingTypingMin: 3000
  greetingTypingMax: 5000
  typingRefreshInterval: 5000

greetings:
  enabled: true
  useAI: false
  template: "Добрый день, {name}!\nЭто Валерия, администратор коворкинга ElasticSpace, приятно познакомиться {{emoji}}"
  templateNoName: "Добрый день!\nЭто Валерия, администратор коворкинга ElasticSpace, приятно познакомиться {{emoji}}"
  shortTemplate: "Добрый день, {name}!"
  shortTemplateNoName: "Добрый день!"
  agentName: Валерия
  emojis:
    - "\U0001F431"
    - "\U0001F60A"
    - "\U0001F338"
    - "\U0001F49A"
    - "\U0001F917"

