currentOffersDetection:
  enabled: true
  keywords:
    - "что актуально"
    - "что есть на сегодня"
    - "какие офисы свободны"
    - "что можете предложить"
    - "какие варианты"
    - "свободные офисы"
    - "что доступно"
    - "есть свободные"
    - "все варианты"
    - "все предложения"
    - "уточните что актуально"
  behavior: "SHOW_ALL_AVAILABLE_OFFICES"
  note: "При срабатывании — AI выдаёт ПОЛНЫЙ список свободных офисов (status=free) из базы: номер, локация, вместимость, цена, доступность. Не задавать уточняющих вопросов — сразу показать все."

strangeQuestions:
  enabled: true
  maxBeforeHandoff: 2
  firstResponseTemplate: "Что?"
  responseTemplate: "Могу ли чем-то помочь, что касается наших офисов?)"
  deferToViewingTemplate: "Такие детали лучше обсудить на просмотре — так Вы сможете всё увидеть своими глазами ) Хотите записаться?"
  delayBetweenMessages: 5000
  allowedTopics:
    - "недвижимость"
    - "аренда"
    - "покупка"
    - "офисы"
    - "коворкинг"
    - "просмотры"
    - "переговорные"

operatorRequest:
  enabled: true
  operatorPatterns:
    - "позови оператора"
    - "переключи на оператора"
    - "хочу говорить с человеком"
    - "соедини с менеджером"
    - "позовите менеджера"
    - "живой оператор"
    - "переключите на человека"
  botQuestionPatterns:
    - "ты бот"
    - "ты робот"
    - "ты нейросеть"
    - "ты искусственный интеллект"
    - "ты живой"
    - "ты человек"
    - "ты настоящий"
    - "ты реальный"
  replyToGreeting: "Я представлялась выше уже.."
  offerManager: "Могу попросить ответить одного из наших старших менеджеров, если надо"
  transferMessage: "Минуту, сейчас попрошу старшего менеджера Кристину или Роберта ответить"
  notBotResponse: "Нет, я менеджер ElasticSpace ) Чем могу помочь?"
  delayBeforeOffer: 10000
  delayBeforeTransfer: 15000

followUp:
  enabled: true
  delayMinutes: 60
  maxPerConversation: 3
  cooldownMinutes: 30
  contextMessages:
    viewing_time: "Получилось согласовать время для просмотра?"
    presentation_sent: "Успели посмотреть презентацию? Если есть вопросы — с удовольствием отвечу!"
    thinking: "Добрый день! Удалось принять решение по офису?"
    minimal: "?"
    media_sent_to_broker: "Подскажите, когда могу пригласить Вас с клиентом на показ?\nВживую наши пространства выглядят еще лучше"
  brokerFollowUp:
    enabled: true
    trigger: media_sent_to_broker
    delaySeconds: 3600
    condition: no_response_from_client
    message: "Подскажите, когда могу пригласить Вас с клиентом на показ?\nВживую наши пространства выглядят еще лучше"

summary:
  enabled: true
  notifyOnViewing: true
  notificationChannel: telegram

mediaResources:
  enabled: false
