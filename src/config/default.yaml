server:
  port: 3000
  host: 0.0.0.0
ai:
  provider: anthropic
  model: claude-3-sonnet-20240229
  temperature: 0.7
  maxTokens: 500
  cacheEnabled: true
  cacheTTL: 1800
  retry:
    maxAttempts: 2
    requestTimeoutMs: 30000
    delayBetweenRetriesMs: 60000
    stallingMessages:
      - "Секунду, уточняю информацию..."
      - "Сейчас подключу коллегу, который больше разбирается в вопросе"
personality:
  name: Валерия
  role: менеджер коворкинга ElasticSpace
  style: friendly
  traits:
    emojiUsage: moderate
    emojiFrequency: 0.3
    preferredEmojis:
      - 😊
      - 👍
      - ✨
      - 🙏
      - ☕
    punctuation: casual
    vocabulary: moderate
    empathy: high
    enthusiasm: moderate
    usesHumor: false
    formalityLevel: formal
  patterns:
    greetings:
      - Здравствуйте!
      - Добрый день!
    farewells:
      - До встречи!
      - Удачного дня!
      - Будем рады видеть!
    acknowledgments:
      - Поняла!
      - Секунду
      - Хороший вопрос!
      - Да, конечно!
    delays:
      - Минуточку
      - Сейчас посмотрю
      - Уточню информацию
    apologies:
      - Извините за ожидание!
    transitions:
      - Кстати,
      - А ещё
    fillers:
      - вот
    preferredPhrases:
      - С удовольствием помогу!
      - Конечно, без проблем!
  restrictions:
    avoidWords:
      - я AI
      - я бот
      - я искусственный интеллект
      - я не человек
      - я программа
      - я языковая модель
      - мне не доступны эмоции
      - я не имею личного опыта
      - ты
      - твой
      - твоего
      - нейросеть
    avoidTopics:
      - политика
      - религия
    maxMessageLength: 500
    avoidStyles:
      - academic
      - legal
situationDetection:
  aiProbing:
    minConfidence: 0.6
    handoffThreshold: 0.8
  complexity:
    maxScore: 70
    handoffThreshold: 75
  emotional:
    escalationThreshold: 0.7
    handoffStates:
      - angry
  confidence:
    minScore: 40
    handoffThreshold: 30
handoff:
  autoHandoffTriggers:
    - ai_probing
    - emotional_escalation
    - low_confidence
  notificationChannels:
    - telegram
  stallingMessages:
    - Минуточку, уточню информацию...
    - Секундочку, проверю...
    - Сейчас узнаю и отвечу...
  customStallingMessages:
    ai_probing:
      - Минуточку, уточню информацию...
    complex_query:
      - Интересный вопрос! Дай минутку, проверю варианты...
    emotional_escalation:
      - Понимаю, сейчас разберусь в ситуации...
    low_confidence:
      - Секундочку, уточню детали...
  estimatedWaitTime: 120
  maxWaitBeforeEscalation: 300
telegram:
  webhook:
    path: /webhook/telegram
knowledgeBasePath: ./knowledge-base
redis:
  enabled: false
  host: localhost
  port: 6379
  db: 0
  keyPrefix: "ai-admin:"
database:
  type: memory
  postgres:
    host: localhost
    port: 5432
    database: ai_admin
    user: ai_admin
    password: REMOVED_FROM_HISTORY
    maxConnections: 10
logging:
  level: info
admin:
  enabled: true
  # password and jwtSecret MUST be set via environment variables:
  #   ADMIN_PASSWORD - admin panel password
  #   ADMIN_JWT_SECRET - JWT signing secret
  tokenExpiry: 24h

# === Бизнес-логика v2.0 ===

workingHours:
  enabled: true
  timezone: "Europe/Moscow"
  start: "09:00"
  end: "22:00"
  oncePerSession: true
  sessionTimeout: 3600
  offHoursMessage: "Добрый день! Сейчас нерабочее время. Мы работаем с 9:00 до 22:00 по московскому времени. Я свяжусь с Вами в рабочее время!"
  schedule:
    monday:
      start: "09:00"
      end: "22:00"
      enabled: true
    tuesday:
      start: "09:00"
      end: "22:00"
      enabled: true
    wednesday:
      start: "09:00"
      end: "22:00"
      enabled: true
    thursday:
      start: "09:00"
      end: "22:00"
      enabled: true
    friday:
      start: "09:00"
      end: "22:00"
      enabled: true
    saturday:
      start: "10:00"
      end: "18:00"
      enabled: true
    sunday:
      start: "10:00"
      end: "18:00"
      enabled: false

context:
  sessionExpiryHours: 24
  maxHistoryLength: 20

conversation:
  enabled: true
  newConversationGapDays: 180
  newDayGapHours: 12
  chatClearedDetection: true

responseDelays:
  enabled: true
  readMin: 8000
  readMax: 12000
  typingMin: 25000
  typingMax: 40000
  typingRefreshInterval: 5000

greetings:
  enabled: true
  useAI: true
  template: "Здравствуйте, {name}! {{emoji}} Меня зовут Валерия, я менеджер коворкинга ElasticSpace. Чем могу Вам помочь?"
  shortTemplate: "Добрый день! {{emoji}}"
  agentName: Валерия
  emojis:
    - "😊"
    - "🤗"
    - "👋"
    - "✨"
    - "💫"

contactQualification:
  enabled: true
  classifyAfterMessages: 2
  spamKeywords: []
  brokerKeywords: []
  residentKeywords: []
  supplierKeywords: []
  residentFolders:
    - "Резиденты"
    - "Арендаторы"
  officeNumberInName: true

strangeQuestions:
  enabled: true
  maxBeforeHandoff: 2
  firstResponseTemplate: "Что?"
  responseTemplate: "Извините, я специализируюсь на вопросах о коворкинге и аренде помещений. Могу ли я помочь Вам в этой области?"
  deferToViewingTemplate: "Такие детали лучше обсудить на просмотре — так Вы сможете всё увидеть своими глазами ) Хотите записаться?"
  delayBetweenMessages: 5000
  allowedTopics:
    - недвижимость
    - аренда
    - покупка
    - офисы
    - коворкинг
    - просмотры
    - переговорные

operatorRequest:
  enabled: true
  operatorPatterns:
    - "позови оператора"
    - "переключи на оператора"
    - "хочу говорить с человеком"
    - "соедини с менеджером"
    - "позовите менеджера"
    - "живой оператор"
    - "переключите на человека"
  botQuestionPatterns:
    - "ты бот"
    - "ты робот"
    - "ты нейросеть"
    - "ты искусственный интеллект"
    - "ты живой"
    - "ты человек"
    - "ты настоящий"
    - "ты реальный"
  replyToGreeting: "Это я писала Вам ранее 😊"
  offerManager: "Хотите, переключу на руководителя?"
  transferMessage: "Хорошо, сейчас переключу!"
  notBotResponse: "Нет, я менеджер ElasticSpace ) Чем могу помочь?"
  delayBeforeOffer: 10000
  delayBeforeTransfer: 15000

followUp:
  enabled: true
  delayMinutes: 60
  maxPerConversation: 3
  cooldownMinutes: 30
  contextMessages:
    viewing_time: "Подскажите, Вам удобно подъехать на этой неделе?"
    presentation_sent: "Удалось ознакомиться с презентацией? Если есть вопросы — с удовольствием отвечу!"
    thinking: "?"
    minimal: "?"

summary:
  enabled: true
  notifyOnViewing: true
  notificationChannel: telegram

mediaResources:
  enabled: false
  basePath: "./media"
  objects: {}
  offices: {}
