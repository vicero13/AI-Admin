    - "я у вас арендую"
    - "мой офис"
    - "наш офис"
    - "мы ваши резиденты"
    - "мы арендуем"
    - "наш договор"
    - "продление договора"
    - "счёт на оплату"
    - "оплата аренды"
    # --- WiFi / Интернет ---
    - "пароль от wifi"
    - "пароль от вайфая"
    - "какой пароль от"
    - "код от переговорной"
    - "код от кабинета"
    - "подключиться к вай-фай"
